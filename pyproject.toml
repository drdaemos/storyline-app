[project]
name = "storyline-app"
version = "0.2.0"
description = "Interactive AI Writer Room application"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.17.0",
    "clerk-backend-api>=3.3.1",
    "click",
    "dotenv>=0.9.9",
    "fastapi>=0.116.1",
    "httpx>=0.28.1",
    "psycopg2-binary>=2.9.10",
    "pydantic>=2.11.7",
    "pydantic-ai[examples]>=2.27.1",
    "pydantic-ai-harness>=0.18.1",
    "pytest>=8.4.1",
    "pyyaml",
    "rich>=14.1.0",
    "sqlalchemy>=2.0.43",
    "uvicorn[standard]>=0.35.0",
    "textual>=8.2.8",
    "logfire[system-metrics]>=5.1.0",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["storyline*"]

[project.scripts]
storyline = "storyline.cli:main"

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-mock",
    "pytest-cov"
]

[dependency-groups]
dev = [
    "pytest-asyncio>=1.2.0",
    "python-lsp-server>=1.13.0",
    "ruff>=0.8.0",
]

[tool.ruff]
target-version = "py312"
line-length = 200

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ANN", # flake8-annotations
]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]  # Don't require annotations in tests

[tool.pytest.ini_options]
pythonpath = ["src"]
