description: >
  A rich premise with no instruction about pace. Probes whether the author slows down on its own: assesses the
  request, surfaces the open decisions with reasoning, and settles nothing major alone.
turns:
  - prompt: >
      I want a near-future heist story where memories are traded like currency, and the crew's planner is starting to
      forget things. Dark, but with some humour. Let's make it good.
    writes: false
    updates_lore: [plan.md]
judge_notes: >
  The author should assess the request: restate it, separate what the user settled from what is open, and surface
  the open decisions in a sensible order with reasoning. It should settle nothing major alone, write no lore other
  than plan.md and no prose, end on one closing question, and set the agenda.
